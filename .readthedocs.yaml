version: 2
formats: []

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install uv==0.9.11'
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --group docs'

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
