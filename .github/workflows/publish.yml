name: Publish to PyPI and GitHub

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.6.0"
          - python: "3.12"
            torch: "2.14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.11"
      - name: Test release commit
        env:
          TEST_PYTHON: ${{ matrix.python }}
          TEST_TORCH: ${{ matrix.torch }}
        run: |
          uv venv .venv --python "$TEST_PYTHON"
          uv pip install --python .venv/bin/python --torch-backend=cpu --group dev -e . "torch==$TEST_TORCH+cpu"
          .venv/bin/python -m pytest
      - name: Check formatting and examples
        if: matrix.torch == '2.14.0'
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python examples/dependency.py
          .venv/bin/python examples/custom_rule.py
          .venv/bin/python examples/pruning.py
          .venv/bin/python examples/fused_attention.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.distributions.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.11"
      - name: Create build environment
        run: uv venv .venv --python 3.12
      - name: Match tag to package version
        run: |
          .venv/bin/python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == f"v{version}"'
      - name: Build and check distributions
        id: distributions
        run: |
          uv pip install --python .venv/bin/python twine packaging
          uv build
          .venv/bin/python -m twine check --strict dist/*.whl dist/*.tar.gz
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from packaging.version import Version

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(Version(version).is_prerelease).lower()}", file=output)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" == "false" ]]; then
              echo "GitHub Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "$RELEASE_TAG" "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
