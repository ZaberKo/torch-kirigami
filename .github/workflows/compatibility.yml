name: Compatibility
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intermediate-releases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.7.*", "2.8.*", "2.9.*", "2.10.*", "2.11.*", "2.12.*", "2.13.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.11"
          enable-cache: true
      - name: Test release line
        env:
          TEST_TORCH: ${{ matrix.torch }}
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --torch-backend=cpu -e . "torch==$TEST_TORCH" pytest numpy
          .venv/bin/python -m pytest
