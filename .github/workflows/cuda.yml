name: CUDA validation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    # Provision a trusted GPU runner with these labels before dispatching.
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.11"
      - name: Install CUDA test environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --torch-backend=cu130 -e . 'torch==2.14.0+cu130' pytest numpy
      - name: Require actual CUDA execution
        run: .venv/bin/python -m pytest --require-cuda
      - name: Run two pruning rounds on CUDA
        run: .venv/bin/python -m examples.pruning --device cuda
